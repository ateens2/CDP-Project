<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDP 프로젝트 로딩 중...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .loading-container {
            text-align: center;
            max-width: 400px;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            animation: pulse 2s ease-in-out infinite;
        }

        .title {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.7;
            margin-bottom: 40px;
        }

        .loading-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border-radius: 2px;
            animation: loading 3s ease-in-out infinite;
        }

        .status-text {
            font-size: 14px;
            opacity: 0.8;
            animation: fadeInOut 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="logo">🌱</div>
        <h1 class="title">CDP 프로젝트</h1>
        <p class="subtitle">Carbon Data Platform</p>
        
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
        
        <p class="status-text">서버를 시작하는 중입니다...</p>
    </div>

    <script>
        const statusTexts = [
            '서버를 시작하는 중입니다...',
            '데이터베이스를 준비하는 중입니다...',
            '웹 인터페이스를 로딩하는 중입니다...',
            '거의 완료되었습니다...'
        ];

        let currentIndex = 0;
        const statusElement = document.querySelector('.status-text');

        setInterval(() => {
            currentIndex = (currentIndex + 1) % statusTexts.length;
            statusElement.textContent = statusTexts[currentIndex];
        }, 1500);
    </script>
</body>
</html>
